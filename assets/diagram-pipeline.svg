<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="Inter,Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17594f"/><stop offset="1" stop-color="#0c352f"/></linearGradient>
    <linearGradient id="gYou" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7ea"/><stop offset="1" stop-color="#ffe9c7"/></linearGradient>
    <linearGradient id="gBot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eafaf6"/><stop offset="1" stop-color="#cdf0e7"/></linearGradient>
    <linearGradient id="gOk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#effaf2"/><stop offset="1" stop-color="#d3f0dc"/></linearGradient>
    <filter id="softD" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#062421" flood-opacity="0.4"/></filter>
    <marker id="arM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb35c"/></marker>
    <marker id="arT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#43dcc6"/></marker>
  </defs>

  <style>
    .ttl  { font-size: 17px; font-weight: 700; }
    .sub  { font-size: 12.5px; opacity: .78; }
    .num  { font-size: 12px; font-weight: 800; fill: #fff; }
    .lbl  { font-size: 12px; font-weight: 700; fill: #ffd9a0; }
    .rise { animation: rise .7s cubic-bezier(.22,1,.36,1) both; }
    .d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}.d5{animation-delay:.9s}
    @keyframes rise { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }
    .flowM { fill:none; stroke:#ffb35c; stroke-width:3; stroke-linecap:round; stroke-dasharray:1 8; animation:dash 1s linear infinite; }
    .flowT { fill:none; stroke:#43dcc6; stroke-width:3; stroke-linecap:round; stroke-dasharray:1 8; animation:dash 1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -9; } }
    .bob  { animation: bob 3.2s ease-in-out infinite; }
    .bob2 { animation: bob 3.2s ease-in-out infinite .7s; }
    .bob3 { animation: bob 3.2s ease-in-out infinite 1.4s; }
    @keyframes bob { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-3px) } }
  </style>

  <rect width="980" height="400" rx="18" fill="url(#bgD)"/>

  <!-- 1 · You: the architect -->
  <g class="rise d1">
    <rect x="40" y="150" width="180" height="100" rx="14" fill="url(#gYou)" filter="url(#softD)"/>
    <circle cx="66" cy="176" r="11" fill="#ff9f1c"/><text x="66" y="180" text-anchor="middle" class="num">1</text>
    <text x="86" y="181" class="ttl" fill="#5a3a10">You: architect</text>
    <text x="58" y="207" class="sub" fill="#5a3a10">Design the pipeline,</text>
    <text x="58" y="224" class="sub" fill="#5a3a10">write the specs</text>
  </g>

  <!-- flow to agents -->
  <path class="flowM" d="M226 200 L286 200" marker-end="url(#arM)"/>

  <!-- 2 · The agent team -->
  <g class="rise d2 bob">
    <rect x="296" y="46" width="180" height="84" rx="14" fill="url(#gBot)" filter="url(#softD)"/>
    <circle cx="322" cy="72" r="11" fill="#1fae9c"/><text x="322" y="76" text-anchor="middle" class="num">2</text>
    <text x="342" y="77" class="ttl" fill="#0c4a40">Research agent</text>
    <text x="314" y="103" class="sub" fill="#0c4a40">Gathers facts via MCP</text>
  </g>
  <g class="rise d2 bob2">
    <rect x="296" y="158" width="180" height="84" rx="14" fill="url(#gBot)" filter="url(#softD)"/>
    <circle cx="322" cy="184" r="11" fill="#1fae9c"/><text x="322" y="188" text-anchor="middle" class="num">2</text>
    <text x="342" y="189" class="ttl" fill="#0c4a40">Draft agent</text>
    <text x="314" y="215" class="sub" fill="#0c4a40">Produces the artifact</text>
  </g>
  <g class="rise d2 bob3">
    <rect x="296" y="270" width="180" height="84" rx="14" fill="url(#gBot)" filter="url(#softD)"/>
    <circle cx="322" cy="296" r="11" fill="#1fae9c"/><text x="322" y="300" text-anchor="middle" class="num">2</text>
    <text x="342" y="301" class="ttl" fill="#0c4a40">Review agent</text>
    <text x="314" y="327" class="sub" fill="#0c4a40">Checks quality gates</text>
  </g>

  <!-- flows converge -->
  <path class="flowT" d="M482 88 C 540 88, 540 180, 586 190" marker-end="url(#arT)"/>
  <path class="flowT" d="M482 200 L586 200" marker-end="url(#arT)"/>
  <path class="flowT" d="M482 312 C 540 312, 540 220, 586 210" marker-end="url(#arT)"/>

  <!-- 3 · Orchestrator -->
  <g class="rise d3">
    <rect x="596" y="150" width="170" height="100" rx="14" fill="url(#gBot)" filter="url(#softD)"/>
    <circle cx="622" cy="176" r="11" fill="#1fae9c"/><text x="622" y="180" text-anchor="middle" class="num">3</text>
    <text x="642" y="181" class="ttl" fill="#0c4a40">Orchestrator</text>
    <text x="614" y="207" class="sub" fill="#0c4a40">Sequences hand-offs,</text>
    <text x="614" y="224" class="sub" fill="#0c4a40">enforces governance</text>
  </g>

  <path class="flowM" d="M772 200 L826 200" marker-end="url(#arM)"/>

  <!-- 4 · Governed output -->
  <g class="rise d4">
    <rect x="836" y="150" width="112" height="100" rx="14" fill="url(#gOk)" filter="url(#softD)"/>
    <circle cx="862" cy="176" r="11" fill="#3f9d4f"/><text x="862" y="180" text-anchor="middle" class="num">4</text>
    <text x="878" y="181" class="ttl" fill="#1d4a28">Ship</text>
    <text x="852" y="207" class="sub" fill="#1d4a28">Audited,</text>
    <text x="852" y="224" class="sub" fill="#1d4a28">observable</text>
  </g>

  <!-- labels -->
  <text x="130" y="130" text-anchor="middle" class="lbl rise d1">design</text>
  <text x="530" y="32" text-anchor="middle" class="lbl rise d2">specialists work in parallel</text>
  <text x="681" y="130" text-anchor="middle" class="lbl rise d3">orchestrate</text>
  <text x="892" y="130" text-anchor="middle" class="lbl rise d4">govern &amp; ship</text>
</svg>
