<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI Architect 201 — Build Systems of Agents</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="description"
      content="A hands-on workshop for designing and governing multi-agent systems with GitHub Copilot and MCP."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffb347'/%3E%3Cstop offset='1' stop-color='%23ff7b1c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg stroke='url(%23g)' stroke-width='2.6' fill='none' stroke-linecap='round'%3E%3Cpath d='M24 13 13 33M24 13 35 33M15.5 35h17'/%3E%3C/g%3E%3Ccircle cx='24' cy='11.5' r='5' fill='url(%23g)'/%3E%3Ccircle cx='12' cy='35' r='5' fill='%231fae9c'/%3E%3Ccircle cx='36' cy='35' r='5' fill='%231fae9c'/%3E%3C/svg%3E"
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    />
    <link rel="stylesheet" href="assets/design.css?v=1" />
    <link rel="stylesheet" href="assets/theme.css?v=1" />
    <link rel="stylesheet" href="assets/sidebar.css?v=1" />
    <link rel="stylesheet" href="assets/cover.css?v=1" />
    <link rel="stylesheet" href="assets/progress.css?v=1" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: '<svg class="ti ti-lg"><use href="assets/icons.svg#i-logo"/></svg> AI Architect 201',
        repo: "https://github.com/JonEricEubanks/ai-architect-201",
        loadSidebar: true,
        coverpage: true,
        auto2top: true,
        search: "auto",
        noEmoji: true,
        copyCode: {
          buttonText: "Copy",
          errorText: "Error",
          successText: "Copied",
        },
        plugins: [
          function (hook) {
            const base = location.pathname.replace(/[^/]*$/, "");
            hook.beforeEach((content) =>
              content.replace(/(src=["'])\/ai-architect-201\//g, "$1" + base),
            );
          },
        ],
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
    <script src="assets/progress.js?v=1"></script>
    <script>
      fetch("assets/icons.svg")
        .then((r) => r.text())
        .then((svg) => {
          const holder = document.createElement("div");
          holder.style.display = "none";
          holder.innerHTML = svg;
          document.body.prepend(holder);

          const ICON_RE = /:([a-z-]+):/g;
          const swap = (root) => {
            const walker = document.createTreeWalker(
              root,
              NodeFilter.SHOW_TEXT,
            );
            const targets = [];
            let n;
            while ((n = walker.nextNode())) {
              ICON_RE.lastIndex = 0;
              if (ICON_RE.test(n.nodeValue)) targets.push(n);
            }
            ICON_RE.lastIndex = 0;
            for (const t of targets) {
              const frag = document.createDocumentFragment();
              const parts = t.nodeValue.split(ICON_RE);
              let swapped = false;
              for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 0) {
                  if (parts[i]) frag.append(document.createTextNode(parts[i]));
                } else {
                  const id = "i-" + parts[i];
                  if (holder.querySelector("#" + id)) {
                    const s = document.createElementNS(
                      "http://www.w3.org/2000/svg",
                      "svg",
                    );
                    s.setAttribute("class", "ti");
                    s.innerHTML = `<use href="#${id}"/>`;
                    frag.append(s);
                    swapped = true;
                  } else {
                    frag.append(document.createTextNode(":" + parts[i] + ":"));
                  }
                }
              }
              if (swapped && t.parentNode) t.parentNode.replaceChild(frag, t);
            }
          };

          const run = () => {
            swap(document.body);
            document.querySelectorAll("[title],[alt]").forEach((el) => {
              ["title", "alt"].forEach((attr) => {
                const v = el.getAttribute(attr);
                if (v && ICON_RE.test(v)) {
                  ICON_RE.lastIndex = 0;
                  el.setAttribute(
                    attr,
                    v
                      .replace(ICON_RE, "")
                      .replace(/\s{2,}/g, " ")
                      .trim(),
                  );
                }
                ICON_RE.lastIndex = 0;
              });
            });
            if (ICON_RE.test(document.title)) {
              ICON_RE.lastIndex = 0;
              document.title = document.title
                .replace(ICON_RE, "")
                .replace(/\s{2,}/g, " ")
                .trim();
            }
            ICON_RE.lastIndex = 0;
          };

          const cleanTitle = () => {
            if (ICON_RE.test(document.title)) {
              ICON_RE.lastIndex = 0;
              document.title = document.title
                .replace(ICON_RE, "")
                .replace(/\s{2,}/g, " ")
                .trim();
            }
            ICON_RE.lastIndex = 0;
          };
          const titleEl = document.querySelector("head > title");
          if (titleEl)
            new MutationObserver(cleanTitle).observe(titleEl, {
              childList: true,
              characterData: true,
              subtree: true,
            });

          window.$docsify.plugins = (window.$docsify.plugins || []).concat(
            (hook) => hook.doneEach(run),
          );
          setTimeout(run, 300);
          let scheduled = false;
          new MutationObserver(() => {
            if (scheduled) return;
            scheduled = true;
            setTimeout(() => {
              scheduled = false;
              run();
            }, 50);
          }).observe(document.body, { childList: true, subtree: true });
        })
        .catch(() => {});

      const overlay = document.createElement("div");
      overlay.id = "shot-lightbox";
      overlay.setAttribute("role", "dialog");
      overlay.setAttribute("aria-modal", "true");
      overlay.innerHTML = '<img alt="" /><p>Click anywhere to close</p>';
      document.body.appendChild(overlay);
      const overlayImg = overlay.querySelector("img");
      const closeLightbox = () => overlay.classList.remove("open");
      overlay.addEventListener("click", closeLightbox);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeLightbox();
      });
      document.addEventListener("click", (e) => {
        const img = e.target.closest && e.target.closest("img.shot");
        if (!img) return;
        overlayImg.src = img.src;
        overlayImg.alt = img.alt || "";
        overlay.classList.add("open");
      });

      // Interactive task-list checkboxes — Docsify renders them disabled.
      (() => {
        const STORE = "at201-checks-v1";
        const load = () => {
          try {
            return JSON.parse(localStorage.getItem(STORE) || "{}");
          } catch {
            return {};
          }
        };
        const save = (data) =>
          localStorage.setItem(STORE, JSON.stringify(data));

        const activate = () => {
          const route = location.hash || "#/";
          const data = load();
          const boxes = document.querySelectorAll(
            '.content input[type="checkbox"]',
          );
          boxes.forEach((cb, i) => {
            cb.removeAttribute("disabled");
            const key = route + ":" + i;
            if (data[key] !== undefined) cb.checked = data[key];
            const fresh = cb.cloneNode(true);
            fresh.addEventListener("change", () => {
              const d = load();
              d[route + ":" + i] = fresh.checked;
              save(d);
            });
            cb.replaceWith(fresh);
          });
        };

        window.$docsify.plugins = (window.$docsify.plugins || []).concat(
          (hook) => hook.doneEach(activate),
        );
      })();
    </script>
  </body>
</html>
